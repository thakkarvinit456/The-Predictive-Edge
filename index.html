<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Predictive Edge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #ddd;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00c6ff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #0072ff;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            display: none;
        }

        .score {
            font-size: 28px;
            font-weight: bold;
        }

        .risk {
            margin-top: 10px;
            font-size: 18px;
        }

        .recommendations {
            margin-top: 15px;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>The Predictive Edge</h1>
    <p class="subtitle">Startup Success Prediction Engine</p>

    <div class="form-group">
        <label>Team Experience (1–5)</label>
        <input type="number" id="team" min="1" max="5">
    </div>

    <div class="form-group">
        <label>Funding Amount (USD)</label>
        <input type="number" id="funding">
    </div>

    <div class="form-group">
        <label>Market Sentiment (0–1)</label>
        <input type="number" step="0.1" id="sentiment">
    </div>

    <div class="form-group">
        <label>Industry Growth Rate (%)</label>
        <input type="number" id="industry">
    </div>

    <button onclick="predictStartup()">Predict Success</button>

    <div class="result" id="resultBox">
        <div class="score" id="score"></div>
        <div class="risk" id="risk"></div>
        <div class="recommendations" id="recommendations"></div>
    </div>
</div>

<script>
function predictStartup() {

    const team = document.getElementById("team").value;
    const funding = document.getElementById("funding").value;
    const sentiment = document.getElementById("sentiment").value;
    const industry = document.getElementById("industry").value;

    // TEMPORARY DUMMY LOGIC (Replace with API call)
    let score = (team * 10) + (funding / 50000) + (sentiment * 20) + (industry * 2);
    score = Math.min(100, Math.round(score));

    let riskLevel = "";
    if (score >= 70) riskLevel = "Low Risk 🚀";
    else if (score >= 40) riskLevel = "Medium Risk ⚠️";
    else riskLevel = "High Risk ❌";

    let recommendation = "";
    if (team < 3) recommendation += "Improve team strength. ";
    if (funding < 100000) recommendation += "Increase funding runway. ";
    if (sentiment < 0.5) recommendation += "Boost marketing & validation. ";
    if (industry < 5) recommendation += "Consider high-growth industry pivot. ";

    document.getElementById("resultBox").style.display = "block";
    document.getElementById("score").innerText = "PoS Score: " + score + "%";
    document.getElementById("risk").innerText = "Risk Category: " + riskLevel;
    document.getElementById("recommendations").innerText = 
        "Recommendations: " + (recommendation || "Strong fundamentals. Maintain momentum.");
}
</script>

</body>
</html>
